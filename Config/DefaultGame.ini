[/Script/GAME_CORE.GameFeelSettings]
; GoW-calibrated camera (research: GoW ~74deg horiz FOV / tight arm; widened slightly for this single-large-boss arena).
; All live-tunable: Project Settings -> Game -> Game Feel.
BaseFOV=78.0
TargetArmLength=320.0
CameraSocketOffset=(X=0.0,Y=55.0,Z=20.0)
FOVInterpSpeed=3.0
; M5: default ONNX brain for the auto-injected UNNEBossPolicyComponent (imported
; by Tools/import_onnx_model.py). Config-only soft path — /Game/Arena/Models is
; force-cooked below so this survives packaging.
NNEBossModelData=/Game/Arena/Models/NNM_BossTurtle.NNM_BossTurtle
; M5 archetype bank: persona -> per-persona ONNX policy + 8-dim behavior centroid.
; Centroid order = FPlayerProfile::ToFloatArray():
;   [AggressionScore, DodgeTendency, BlockTendency, OpenerAggression,
;    PressureResponse, KitingScore, ComboCompletionRate, PositionalVariance]
; each in [0,1], 0.5 = neutral. Selection: UNNEBossPolicyComponent cosine-matches
; the player's stored PlayerMemoryComponent profile against these centroids.
; PLACEHOLDER VALUES — hand-authored persona sketches, to be re-measured as the
; mean profile from replays/<persona>/ once overnight runs exist for each persona.
; rusher: high aggression + aggressive openers, keeps swinging under pressure,
;         near-zero blocking, sticks to melee (low kiting/positional variance).
+NNEArchetypeBank=(Persona="rusher",ModelData="/Game/Arena/Models/NNM_BossRusher.NNM_BossRusher",Centroid=(0.85,0.35,0.10,0.85,0.65,0.10,0.75,0.35))
; turtle: passive, blocks nearly everything, timid openers, folds under pressure,
;         holds ground (low kiting, very low positional variance).
+NNEArchetypeBank=(Persona="turtle",ModelData="/Game/Arena/Models/NNM_BossTurtle.NNM_BossTurtle",Centroid=(0.15,0.30,0.90,0.10,0.25,0.20,0.35,0.20))
; Both model paths live under /Game/Arena/Models — force-cooked below, so these
; config-only soft references survive packaging like NNEBossModelData does.

[/Script/UnrealEd.ProjectPackagingSettings]
; A config-only FSoftObjectPath (GameFeelSettings.NNEBossModelData) is NOT a cook
; dependency — without this the packaged build silently ships without the NNE
; model and the boss degrades to the scripted fallback brain.
+DirectoriesToAlwaysCook=(Path="/Game/Arena/Models")
