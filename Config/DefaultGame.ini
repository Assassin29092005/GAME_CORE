; M5: default ONNX brain for the auto-injected UNNEBossPolicyComponent (imported
; by Tools/import_onnx_model.py). Config-only soft path — /Game/Arena/Models is
; force-cooked below so this survives packaging.
NNEBossModelData=/Game/Arena/Models/NNM_BossTurtle.NNM_BossTurtle
; M5 archetype bank: persona -> per-persona ONNX policy + 8-dim behavior centroid.
; Centroid order = FPlayerProfile::ToFloatArray():
;   [AggressionScore, DodgeTendency, BlockTendency, OpenerAggression,
;    PressureResponse, KitingScore, ComboCompletionRate, PositionalVariance]
; each in [0,1], 0.5 = neutral. Selection: UNNEBossPolicyComponent matches the
; player's stored PlayerMemoryComponent profile against these centroids with
; MEAN-CENTERED cosine (both vectors centered at 0.5 before the dot product —
; raw cosine on all-positive profiles saturates near 1 and barely discriminates).
; MEASURED VALUES — all-steps mean profile from replays/<persona>/, computed by
; Python/measure_centroids.py (2026-07-06: rusher 201 eps/41k steps, turtle
; 160 eps/112k steps). Re-run the script after new overnight runs and paste.
+NNEArchetypeBank=(Persona="rusher",ModelData="/Game/Arena/Models/NNM_BossRusher.NNM_BossRusher",Centroid=(0.999,0.442,0.442,0.450,0.500,0.517,0.780,0.537))
+NNEArchetypeBank=(Persona="turtle",ModelData="/Game/Arena/Models/NNM_BossTurtle.NNM_BossTurtle",Centroid=(0.995,0.466,0.333,0.300,0.433,0.619,0.088,0.223))
; kiter: STAGED, NOT ENABLED — NNM_BossKiter is imported (6k-step checkpoint) but
; eval_archetypes.py scored it dodge-only (94% dodge, 0W/0L/40D vs the scripted
; duel) — below the promotion bar turtle set (40-0). Uncomment after a full
; overnight kiter run + re-eval + re-measured centroid (4 eps is noise):
;+NNEArchetypeBank=(Persona="kiter",ModelData="/Game/Arena/Models/NNM_BossKiter.NNM_BossKiter",Centroid=(0.751,0.549,0.500,0.175,0.500,0.775,0.193,0.124))
; Both model paths live under /Game/Arena/Models — force-cooked below, so these
; config-only soft references survive packaging like NNEBossModelData does.

